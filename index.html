<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Jeygly Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f3f4f6;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 3px 12px #0003;
}

.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.header-buttons{
  display:flex;
  gap:8px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:bold;
}

.cart-btn{
  background:#22c55e;
  color:white;
}

.config-btn{
  background:#374151;
  color:white;
}

.hero{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  padding:55px 20px;
  text-align:center;
}

.hero h1{
  font-size:40px;
  margin-bottom:10px;
}

.hero p{
  font-size:18px;
  opacity:.95;
}

.container{
  max-width:1200px;
  margin:25px auto;
  padding:0 15px;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.search{
  flex:1;
  min-width:220px;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
}

select{
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  background:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.product{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 15px #00000012;
  transition:.2s;
}

.product:hover{
  transform:translateY(-4px);
}

.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#e5e7eb;
}

.product-content{
  padding:15px;
}

.product h3{
  margin-bottom:7px;
}

.description{
  color:#6b7280;
  font-size:14px;
  min-height:38px;
}

.price{
  color:#2563eb;
  font-size:22px;
  font-weight:bold;
  margin:12px 0;
}

.product-buttons{
  display:flex;
  gap:7px;
}

.add{
  background:#2563eb;
  color:white;
  flex:1;
}

.edit{
  background:#f59e0b;
  color:white;
}

.delete{
  background:#ef4444;
  color:white;
}

.empty{
  text-align:center;
  padding:50px;
  color:#6b7280;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:2000;
  padding:20px;
  overflow:auto;
}

.modal-content{
  background:white;
  max-width:600px;
  margin:30px auto;
  padding:25px;
  border-radius:18px;
}

.modal h2{
  margin-bottom:20px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input,
.form-group textarea{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:9px;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.preview{
  width:100%;
  max-height:250px;
  object-fit:contain;
  margin-top:10px;
  border-radius:10px;
  display:none;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.save{
  background:#22c55e;
  color:white;
  flex:1;
}

.cancel{
  background:#6b7280;
  color:white;
  flex:1;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #e5e7eb;
}

.cart-item img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:8px;
}

.cart-info{
  flex:1;
}

.qty{
  display:flex;
  gap:5px;
  align-items:center;
}

.qty button{
  padding:5px 9px;
  background:#e5e7eb;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin-top:20px;
  text-align:right;
}

.whatsapp{
  width:100%;
  background:#25D366;
  color:white;
  margin-top:15px;
  font-size:17px;
}

.settings{
  display:none;
}

.color-row{
  display:flex;
  gap:10px;
  align-items:center;
}

.color-row input{
  width:60px;
  height:40px;
}

footer{
  margin-top:50px;
  background:#111827;
  color:white;
  text-align:center;
  padding:30px;
}

@media(max-width:600px){
  .hero h1{
    font-size:30px;
  }

  .header{
    flex-wrap:wrap;
  }

  .product img{
    height:190px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo" id="logoText">Jeygly Store</div>

    <div class="header-buttons">
      <button class="config-btn" onclick="openSettings()">⚙️ Configurar</button>
      <button class="cart-btn" onclick="openCart()">🛒 Carrito (<span id="cartCount">0</span>)</button>
    </div>
  </div>
</header>

<section class="hero">
  <h1 id="heroTitle">Bienvenido a Jeygly Store</h1>
  <p id="heroSubtitle">Encuentra tus productos favoritos</p>
</section>

<main class="container">

  <div class="controls">
    <input
      class="search"
      id="search"
      type="text"
      placeholder="🔎 Buscar productos..."
      oninput="renderProducts()"
    >

    <select id="category" onchange="renderProducts()">
      <option value="all">Todas las categorías</option>
    </select>

    <button onclick="openProductModal()" style="background:#7c3aed;color:white;">
      ➕ Agregar producto
    </button>
  </div>

  <div id="products" class="products"></div>

</main>

<footer>
  <p id="footerText">© 2026 Jeygly Store</p>
</footer>


<!-- MODAL PRODUCTO -->

<div class="modal" id="productModal">

  <div class="modal-content">

    <h2 id="productModalTitle">Agregar producto</h2>

    <input type="hidden" id="productId">

    <div class="form-group">
      <label>Nombre del producto</label>
      <input id="productName" type="text" placeholder="Ejemplo: Zapatillas">
    </div>

    <div class="form-group">
      <label>Precio</label>
      <input id="productPrice" type="number" step="0.01" placeholder="0.00">
    </div>

    <div class="form-group">
      <label>Categoría</label>
      <input id="productCategory" type="text" placeholder="Ejemplo: Ropa">
    </div>

    <div class="form-group">
      <label>Descripción</label>
      <textarea id="productDescription" placeholder="Descripción del producto"></textarea>
    </div>

    <div class="form-group">
      <label>Imagen</label>
      <input id="productImage" type="file" accept="image/*" onchange="previewImage(event)">
      <img id="imagePreview" class="preview">
    </div>

    <div class="modal-buttons">
      <button class="save" onclick="saveProduct()">💾 Guardar</button>
      <button class="cancel" onclick="closeProductModal()">Cancelar</button>
    </div>

  </div>
</div>


<!-- MODAL CARRITO -->

<div class="modal" id="cartModal">

  <div class="modal-content">

    <h2>🛒 Mi carrito</h2>

    <div id="cartItems"></div>

    <div class="total">
      Total: S/ <span id="cartTotal">0.00</span>
    </div>

    <button class="whatsapp" onclick="sendWhatsApp()">
      📲 Pedir por WhatsApp
    </button>

    <div class="modal-buttons">
      <button class="cancel" onclick="closeCart()">Cerrar</button>
    </div>

  </div>
</div>


<!-- MODAL CONFIGURACIÓN -->

<div class="modal" id="settingsModal">

  <div class="modal-content">

    <h2>⚙️ Configuración</h2>

    <div class="form-group">
      <label>Nombre de la tienda</label>
      <input id="storeName" type="text">
    </div>

    <div class="form-group">
      <label>Título principal</label>
      <input id="storeTitle" type="text">
    </div>

    <div class="form-group">
      <label>Subtítulo</label>
      <input id="storeSubtitle" type="text">
    </div>

    <div class="form-group">
      <label>Número de WhatsApp</label>
      <input id="whatsappNumber" type="text" placeholder="51999999999">
    </div>

    <div class="form-group">
      <label>Color del encabezado</label>

      <div class="color-row">
        <input id="headerColor" type="color">
        <span>Selecciona un color</span>
      </div>

    </div>

    <div class="form-group">
      <label>Color principal</label>

      <div class="color-row">
        <input id="primaryColor" type="color">
        <span>Color de botones</span>
      </div>

    </div>

    <div class="modal-buttons">

      <button class="save" onclick="saveSettings()">
        💾 Guardar configuración
      </button>

      <button class="cancel" onclick="closeSettings()">
        Cerrar
      </button>

    </div>

  </div>
</div>
