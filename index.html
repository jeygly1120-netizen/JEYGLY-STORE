<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Jeygly Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="header">
    <div class="logo" id="logoText">Jeygly Store</div>

    <div class="header-buttons">
      <button class="config-btn" onclick="openSettings()">⚙️ Configurar</button>
      <button class="cart-btn" onclick="openCart()">
        🛒 Carrito (<span id="cartCount">0</span>)
      </button>
    </div>
  </div>
</header>

<section class="hero">
  <h1 id="heroTitle">Bienvenido a Jeygly Store</h1>
  <p id="heroSubtitle">Encuentra tus productos favoritos</p>
</section>

<main class="container">

  <div class="controls">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔎 Buscar productos..."
      oninput="renderProducts()"
    >

    <select id="category" onchange="renderProducts()">
      <option value="all">Todas las categorías</option>
    </select>

    <button class="add-product-btn" onclick="openProductModal()">
      ➕ Agregar producto
    </button>

  </div>

  <div id="products" class="products"></div>

</main>

<footer>
  <p id="footerText">© 2026 Jeygly Store</p>
</footer>


<!-- PRODUCTO -->

<div class="modal" id="productModal">

  <div class="modal-content">

    <h2 id="productModalTitle">Agregar producto</h2>

    <input type="hidden" id="productId">

    <label>Nombre del producto</label>
    <input id="productName" type="text" placeholder="Nombre">

    <label>Precio</label>
    <input id="productPrice" type="number" step="0.01" placeholder="0.00">

    <label>Categoría</label>
    <input id="productCategory" type="text" placeholder="Ejemplo: Ropa">

    <label>Descripción</label>
    <textarea id="productDescription" placeholder="Descripción"></textarea>

    <label>Imagen del producto</label>

    <input
      id="productImage"
      type="file"
      accept="image/*"
      onchange="previewImage(event)"
    >

    <img id="imagePreview" class="image-preview">

    <div class="modal-buttons">
      <button class="save-btn" onclick="saveProduct()">💾 Guardar</button>
      <button class="cancel-btn" onclick="closeProductModal()">Cancelar</button>
    </div>

  </div>

</div>


<!-- CARRITO -->

<div class="modal" id="cartModal">

  <div class="modal-content">

    <h2>🛒 Mi carrito</h2>

    <div id="cartItems"></div>

    <div class="total">
      Total: S/ <span id="cartTotal">0.00</span>
    </div>

    <button class="whatsapp-btn" onclick="sendWhatsApp()">
      📲 Pedir por WhatsApp
    </button>

    <button class="cancel-btn full" onclick="closeCart()">
      Cerrar
    </button>

  </div>

</div>


<!-- CONFIGURACIÓN -->

<div class="modal" id="settingsModal">

  <div class="modal-content">

    <h2>⚙️ Configuración</h2>

    <label>Nombre de la tienda</label>
    <input id="storeName" type="text">

    <label>Título principal</label>
    <input id="storeTitle" type="text">

    <label>Subtítulo</label>
    <input id="storeSubtitle" type="text">

    <label>Número de WhatsApp</label>
    <input
      id="whatsappNumber"
      type="tel"
      placeholder="51999999999"
    >

    <label>Color del encabezado</label>
    <input id="headerColor" type="color">

    <label>Color principal</label>
    <input id="primaryColor" type="color">

    <div class="modal-buttons">

      <button class="save-btn" onclick="saveSettings()">
        💾 Guardar
      </button>

      <button class="cancel-btn" onclick="closeSettings()">
        Cerrar
      </button>

    </div>

  </div>

</div>


<script src="script.js"></script>

</body>
  </html>
