<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c5ce7">
<meta name="description" content="Jeygly Store - Tienda online personalizable">
<title>Jeygly Store</title>

<style>
:root{
  --primary:#6c5ce7;
  --secondary:#00b894;
  --accent:#fdcb6e;
  --danger:#d63031;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#202124;
  --muted:#6b7280;
  --border:#e5e7eb;
  --radius:18px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
  --columns:4;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

.hidden{
  display:none!important;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:1400px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:220px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:14px;
  object-fit:cover;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
}

.brand{
  font-size:21px;
  font-weight:900;
}

.brand small{
  display:block;
  font-size:11px;
  color:var(--muted);
  font-weight:500;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  padding:13px 18px;
  border:1px solid var(--border);
  border-radius:999px;
  outline:none;
  background:#f8fafc;
}

.search input:focus{
  border-color:var(--primary);
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  border:0;
  background:#f1f3f8;
  width:45px;
  height:45px;
  border-radius:50%;
  font-size:20px;
}

.icon-btn:hover{
  background:var(--primary);
  color:white;
}

/* HERO */
.hero{
  max-width:1400px;
  margin:25px auto;
  padding:55px 30px;
  border-radius:28px;
  background:
    radial-gradient(circle at 90% 10%,rgba(255,255,255,.25),transparent 30%),
    linear-gradient(135deg,var(--primary),#4834d4);
  color:white;
  position:relative;
  overflow:hidden;
}

.hero h1{
  font-size:clamp(32px,5vw,62px);
  line-height:1;
  max-width:800px;
  margin-bottom:18px;
}

.hero p{
  max-width:700px;
  opacity:.9;
  font-size:18px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  margin-top:25px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  padding:12px 18px;
  border-radius:12px;
  background:var(--primary);
  color:white;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
  filter:brightness(.96);
}

.btn-light{
  background:white;
  color:var(--primary);
}

.btn-success{
  background:#25d366;
}

.btn-danger{
  background:var(--danger);
}

.btn-secondary{
  background:#eef0f6;
  color:var(--text);
}

/* LAYOUT */
.page{
  max-width:1400px;
  margin:auto;
  padding:0 20px 50px;
}

.layout{
  display:grid;
  grid-template-columns:1fr;
  gap:25px;
}

.sidebar{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
}

.sidebar.left{
  order:-1;
}

.sidebar h3{
  margin-bottom:12px;
}

.side-links{
  display:grid;
  gap:8px;
}

.side-links button{
  border:0;
  padding:11px;
  background:#f5f6fa;
  text-align:left;
  border-radius:10px;
}

.side-links button:hover{
  background:var(--primary);
  color:white;
}

/* CATEGORIES */
.categories{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:5px 0 20px;
}

.category{
  white-space:nowrap;
  border:1px solid var(--border);
  background:white;
  padding:10px 16px;
  border-radius:999px;
}

.category.active,
.category:hover{
  background:var(--primary);
  color:white;
}

/* PRODUCTS */
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin:10px 0 20px;
}

.section-title h2{
  font-size:28px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(var(--columns),minmax(0,1fr));
  gap:18px;
}

.product{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
  transition:.25s;
  position:relative;
}

.product:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow);
}

.product-image{
  aspect-ratio:1/1;
  background:#f0f2f6;
  position:relative;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.badge{
  position:absolute;
  top:12px;
  left:12px;
  background:var(--accent);
  padding:5px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:800;
}

.product-body{
  padding:16px;
}

.product-category{
  color:var(--primary);
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
}

.product h3{
  margin:5px 0;
}

.product-desc{
  color:var(--muted);
  font-size:14px;
  min-height:42px;
}

.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:15px;
}

.price{
  font-size:20px;
  font-weight:900;
}

.add-cart{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:var(--primary);
  color:white;
  font-size:20px;
}

/* CUSTOM BLOCKS */
.custom-block{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:25px;
  margin:25px 0;
  box-shadow:var(--shadow);
}

.custom-block img{
  max-height:300px;
  object-fit:cover;
  width:100%;
  border-radius:15px;
  margin-top:15px;
}

/* CART */
.cart-panel{
  position:fixed;
  right:0;
  top:0;
  width:min(430px,100%);
  height:100vh;
  background:white;
  z-index:3000;
  box-shadow:-15px 0 50px rgba(0,0,0,.2);
  transform:translateX(100%);
  transition:.3s;
  display:flex;
  flex-direction:column;
}

.cart-panel.open{
  transform:translateX(0);
}

.cart-header{
  padding:20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
}

.cart-items{
  flex:1;
  overflow:auto;
  padding:20px;
}

.cart-item{
  display:grid;
  grid-template-columns:60px 1fr auto;
  gap:10px;
  align-items:center;
  border-bottom:1px solid var(--border);
  padding:12px 0;
}

.cart-item img{
  width:60px;
  height:60px;
  border-radius:10px;
  object-fit:cover;
}

.qty{
  display:flex;
  gap:5px;
  align-items:center;
  margin-top:5px;
}

.qty button{
  border:0;
  width:25px;
  height:25px;
  border-radius:6px;
}

.cart-footer{
  padding:20px;
  border-top:1px solid var(--border);
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:22px;
  font-weight:900;
  margin-bottom:15px;
}

/* MODALS */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:4000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.overlay.open{
  display:flex;
}

.modal{
  width:min(1000px,100%);
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:22px;
  padding:25px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:15px;
}

.close{
  border:0;
  background:#f0f1f5;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.form-group{
  display:grid;
  gap:7px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  font-size:13px;
  font-weight:800;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px;
  outline:none;
}

.form-group textarea{
  min-height:100px;
  resize:vertical;
}

.form-actions{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:20px;
  flex-wrap:wrap;
}

/* ADMIN */
.admin-tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.admin-tab{
  border:0;
  padding:10px 14px;
  background:#f1f3f8;
  border-radius:10px;
}

.admin-tab.active{
  background:var(--primary);
  color:white;
}

.admin-content{
  display:none;
}

.admin-content.active{
  display:block;
}

.setting-card{
  background:#f8f9fc;
  padding:18px;
  border-radius:15px;
  margin-bottom:15px;
}

.setting-card h3{
  margin-bottom:12px;
}

.color-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.color-box input{
  width:100%;
  height:45px;
  padding:2px;
}

.range-row{
  display:flex;
  gap:12px;
  align-items:center;
}

.range-row input{
  flex:1;
}

.admin-product{
  display:grid;
  grid-template-columns:70px 1fr auto;
  gap:12px;
  align-items:center;
  background:white;
  padding:10px;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:8px;
}

.admin-product img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
}

.block-admin{
  background:white;
  border:1px solid var(--border);
  padding:14px;
  border-radius:12px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

/* FILES */
.file-item{
  padding:12px;
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  gap:10px;
}

/* AI */
.ai-box{
  background:linear-gradient(135deg,#17172a,#302b63);
  color:white;
  border-radius:20px;
  padding:25px;
}

.ai-result{
  background:rgba(255,255,255,.1);
  border-radius:12px;
  padding:15px;
  margin-top:15px;
  white-space:pre-wrap;
}

/* FOOTER */
.footer{
  margin-top:50px;
  background:#111827;
  color:white;
  padding:45px 20px;
}

.footer-inner{
  max-width:1400px;
  margin:auto;
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:30px;
}

.footer p{
  color:#b7becb;
}

.footer-bottom{
  max-width:1400px;
  margin:30px auto 0;
  padding-top:20px;
  border-top:1px solid #303745;
  color:#9ca3af;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translate(-50%,20px);
  background:#111827;
  color:white;
  padding:13px 20px;
  border-radius:12px;
  opacity:0;
  pointer-events:none;
  z-index:9000;
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* RESPONSIVE */
@media(min-width:1050px){
  .layout.sidebar-left{
    grid-template-columns:250px 1fr;
  }

  .layout.sidebar-right{
    grid-template-columns:1fr 250px;
  }

  .layout.sidebar-none{
    grid-template-columns:1fr;
  }
}

@media(max-width:1000px){
  :root{
    --columns:3;
  }

  .header-inner{
    flex-wrap:wrap;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .color-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:700px){
  :root{
    --columns:2;
  }

  .page{
    padding:0 12px 40px;
  }

  .hero{
    margin:15px 0;
    padding:35px 22px;
  }

  .hero h1{
    font-size:38px;
  }

  .product-grid{
    gap:10px;
  }

  .product-body{
    padding:12px;
  }

  .product-desc{
    font-size:12px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .footer-inner{
    grid-template-columns:1fr;
  }

  .logo-area{
    min-width:0;
    flex:1;
  }
}

@media(max-width:430px){
  :root{
    --columns:1;
  }

  .header-actions .icon-btn:nth-child(2){
    display:none;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">

    <div class="logo-area">
      <img id="logo" class="logo" alt="Logo">
      <div class="brand">
        <span id="storeNameHeader">Jeygly Store</span>
        <small id="storeSubtitleHeader">Tu tienda online</small>
      </div>
    </div>

    <div class="search">
      <input id="searchInput" type="search" placeholder="Buscar productos...
