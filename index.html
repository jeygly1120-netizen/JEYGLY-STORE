<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jeygly Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    button,
    input,
    select {
      font: inherit;
    }

    /* CABECERA */

    header {
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
      padding: 25px 20px;
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
    }

    .subtitle {
      margin-top: 6px;
      opacity: 0.9;
    }

    .cart-button {
      border: none;
      background: white;
      color: #111827;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    /* CONTENEDOR */

    .container {
      width: 92%;
      max-width: 1200px;
      margin: 25px auto;
    }

    /* PANEL */

    .toolbar {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      display: grid;
      grid-template-columns: 1fr 180px auto;
      gap: 12px;
      margin-bottom: 25px;
    }

    .toolbar input,
    .toolbar select {
      width: 100%;
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 10px;
      outline: none;
    }

    .toolbar button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    /* PRODUCTOS */

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
      transition: 0.2s;
    }

    .product:hover {
      transform: translateY(-4px);
    }

    .product-image {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 17px;
    }

    .category {
      color: #2563eb;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      font-size: 14px;
      min-height: 38px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 13px;
    }

    .add-button {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .add-button:hover {
      background: #2563eb;
    }

    /* EDITOR */

    .editor {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      margin-top: 30px;
    }

    .editor h2 {
      margin-bottom: 15px;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .editor input,
    .editor textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    .editor textarea {
      min-height: 90px;
      resize: vertical;
    }

    .editor button {
      border: none;
      background: #16a34a;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 12px;
    }

    /* CARRITO */

    .cart {
      position: fixed;
      right: -420px;
      top: 0;
      width: 390px;
      max-width: 92%;
      height: 100vh;
      background: white;
      z-index: 1000;
      box-shadow: -5px 0 25px rgba(0,0,0,0.2);
      padding: 20px;
      transition: 0.3s;
      overflow-y: auto;
    }

    .cart.open {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-cart {
      border: none;
      background: #eee;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }

    .cart-item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .remove-button {
      border: none;
      background: #dc2626;
      color: white;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .cart-total {
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
    }

    .whatsapp {
      width: 100%;
      border: none;
      background: #25d366;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* PIE */

    footer {
      margin-top: 50px;
      padding: 30px;
      background: #111827;
      color: white;
      text-align: center;
    }

    /* RESPONSIVE */

    @media (max-width: 950px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
      }

      .editor-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .products {
        grid-template-columns: 1fr;
      }

      .logo {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- CABECERA -->

  <header>
    <div class="header-content">

      <div>
        <div class="logo" id="storeName">
          Jeygly Store
        </div>

        <div class="subtitle" id="storeSubtitle">
          Tu tienda moderna en línea
        </div>
      </div>

      <button class="cart-button" onclick="openCart()">
        🛒 Carrito
        <span id="cartCount">0</span>
      </button>

    </div>
  </header>


  <!-- CONTENIDO -->

  <main class="container">

    <!-- BUSCADOR -->

    <div class="toolbar">

      <input
        type="text"
        id="search"
        placeholder="🔎 Buscar productos..."
        oninput="renderProducts()"
      >

      <select id="categoryFilter" onchange="renderProducts()">
        <option value="todos">Todas las categorías</option>
      </select>

      <button onclick="showEditor()">
        ⚙️ Configurar tienda
      </button>

    </div>


    <!-- PRODUCTOS -->

    <section>
      <div class="products" id="products"></div>
    </section>


    <!-- EDITOR -->

    <section class="editor" id="editor" style="display:none;">

      <h2>⚙️ Configurar Jeygly Store</h2>

      <div class="editor-grid">

        <input
          type="text"
          id="editStoreName"
          placeholder="Nombre de la tienda"
        >

        <input
          type="text"
          id="editSubtitle"
          placeholder="Subtítulo"
        >

        <input
          type="text"
          id="editWhatsapp"
          placeholder="Número WhatsApp con código de país"
        >

        <input
          type="text"
          id="editColor"
          placeholder="Color principal. Ejemplo: #2563eb"
        >

      </div>

      <button onclick="saveSettings()">
        💾 Guardar configuración
      </button>

      <button
        onclick="addProductForm()"
        style="background:#2563eb;"
      >
        ➕ Agregar producto
      </button>

      <div id="newProductForm" style="display:none; margin-top:20px;">

        <div class="editor-grid">

          <input
            id="newName"
            placeholder="Nombre del producto"
          >

          <input
            id="newPrice"
            type="number"
            placeholder="Precio"
          >

          <input
            id="newCategory"
            placeholder="Categoría"
          >

          <input
            id="newImage"
            placeholder="URL de imagen"
          >

          <textarea
            id="newDescription"
            placeholder="Descripción"
          ></textarea>

        </div>

        <button
          onclick="createProduct()"
          style="background:#7c3aed;"
        >
          Crear producto
        </button>

      </div>

    </section>

  </main>


  <!-- CARRITO -->

  <aside class="cart" id="cart">

    <div class="cart-header">

      <h2>🛒 Mi carrito</h2>

      <button
        class="close-cart"
        onclick="closeCart()"
      >
        ✕
      </button>

    </div>

    <div id="cartItems"></div>

    <div class="cart-total">
      Total: S/ <span id="cartTotal">0.00</span>
    </div>

    <button
      class="whatsapp"
      onclick="sendWhatsApp()"
    >
      📲 Pedir por WhatsApp
    </button>

  </aside>


  <!-- PIE -->

  <footer>
    <p>© 2026 Jeygly Store</p>
    <p>Tu tienda moderna en línea</p>
  </footer>


  <script>

    /* =========================
       DATOS INICIALES
    ========================= */

    let products = [
      {
        id: 1,
        name: "Producto Premium",
        price: 49.90,
        category: "Destacados",
        description: "Producto de excelente calidad.",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80"
      },

      {
        id: 2,
        name: "Audífonos",
        price: 79.90,
        category: "Tecnología",
        description: "Audífonos modernos para música.",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80"
      },

      {
        id: 3,
        name: "Zapatillas",
        price: 119.90,
        category: "Moda",
        description: "Zapatillas cómodas y modernas.",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
      },

      {
        id: 4,
        name: "Mochila",
        price: 89.90,
        category: "Accesorios",
        description: "Mochila práctica para todos los días.",
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=800&q=80"
      }
    ];


    let cart = [];

    let settings = {
      storeName: "Jeygly Store",
      subtitle: "Tu tienda moderna en línea",
      whatsapp: "",
      color: "#2563eb"
    };


    /* =========================
       CARGAR CONFIGURACIÓN
    ========================= */

    function loadSettings() {

      const savedSettings =
        localStorage.getItem("jeyglySettings");

      if (savedSettings) {
        try {
          settings = JSON.parse(savedSettings);
        } catch (error) {
          console.log("Configuración inválida.");
        }
      }

      const savedProducts =
        localStorage.getItem("jeyglyProducts");

      if (savedProducts) {
        try {
          products = JSON.parse(savedProducts);
        } catch (error) {
          console.log("Productos inválidos.");
        }
      }

      document.getElementById("storeName").textContent =
        settings.storeName;

      document.getElementById("storeSubtitle").textContent =
        settings.subtitle;

      document.documentElement.style.setProperty(
        "--main-color",
        settings.color
      );

      updateColor();

      updateCategories();

      renderProducts();
    }


    /* =========================
       COLOR
    ========================= */

    function updateColor() {

      document.querySelectorAll(
        ".toolbar button"
      ).forEach(button => {
        button.style.background = settings.color;
      });

    }


    /* =========================
       CATEGORÍAS
    ========================= */

    function updateCategories() {

      const select =
        document.getElementById("categoryFilter");

      const categories =
        [...new Set(products.map(product => product.category))];

      select.innerHTML =
        '<option value="todos">Todas las categorías</option>';

      categories.forEach(category => {

        const option =
          document.createElement("option");

        option.value = category;
        option.textContent = category;

        select.appendChild(option);

      });

    }


    /* =========================
       MOSTRAR PRODUCTOS
    ========================= */

    function renderProducts() {

      const container =
        document.getElementById("products");

      const search =
        document.getElementById("search")
          .value
          .toLowerCase();

      const category =
        document.getElementById("categoryFilter")
          .value;

      container.innerHTML = "";

      const filtered =
        products.filter(product => {

          const matchesSearch =
            product.name
              .toLowerCase()
              .includes(search);

          const matchesCategory =
            category === "todos" ||
            product.category === category;

          return matchesSearch && matchesCategory;

        });


      if (filtered.length === 0) {

        container.innerHTML =
          "<p>No se encontraron productos.</p>";

        return;
      }


      filtered.forEach(product => {

        const card =
          document.createElement("article");

        card.className = "product";

        card.innerHTML = `

          <img
            class="product-image"
            src="${escapeHTML(product.image)}"
            alt="${escapeHTML(product.name)}"
            onerror="this.src='https://via.placeholder.com/800x600?text=Producto'"
          >

          <div class="product-info">

            <div class="category">
              ${escapeHTML(product.category)}
            </div>

            <h3>
              ${escapeHTML(product.name)}
            </h3>

            <div class="description">
              ${escapeHTML(product.description)}
            </div>

            <div class="price">
              S/ ${Number(product.price).toFixed(2)}
            </div>

            <button
              class="add-button"
              onclick="addToCart(${product.id})"
            >
              🛒 Agregar al carrito
            </button>

          </div>
        `;

        container.appendChild(card);

      });

    }


    /* =========================
       SEGURIDAD TEXTO
    ========================= */

    function escapeHTML(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       CARRITO
    ========================= */

    function addToCart(id) {

      const product =
        products.find(item => item.id === id);

      if (!product) return;

      cart.push(product);

      updateCart();

      openCart();

    }


    function removeFromCart(index) {

      cart.splice(index, 1);

      updateCart();

    }


    function updateCart() {

      const items =
        document.getElementById("cartItems");

      const count =
        document.getElementById("cartCount");

      const total =
        document.getElementById("cartTotal");

      items.innerHTML = "";

      let totalPrice = 0;


      cart.forEach((product, index) => {

        totalPrice += Number(product.price);

        const div =
          document.createElement("div");

        div.className = "cart-item";

        div.innerHTML = `

          <div class="cart-item-top">

            <div>
              <strong>
                ${escapeHTML(product.name)}
              </strong>

              <div>
                S/ ${Number(product.price).toFixed(2)}
              </div>
            </div>

            <button
              class="remove-button"
              onclick="removeFromCart(${index})"
            >
              X
            </button>

          </div>
        `;

        items.appendChild(div);

      });


      count.textContent = cart.length;

      total.textContent =
        totalPrice.toFixed(2);

    }


    function openCart() {

      document
        .getElementById("cart")
        .classList.add("open");

    }


    function closeCart() {

      document
        .getElementById("cart")
        .classList.remove("open");

    }


    /* =========================
       WHATSAPP
    ========================= */

    function sendWhatsApp() {

      if (cart.length === 0) {

        alert("El carrito está vacío.");

        return;
      }


      if (!settings.whatsapp) {

        alert(
          "Primero configura tu número de WhatsApp."
        );

        showEditor();

        return;
      }


      let message =
        "Hola, quiero realizar un pedido:%0A%0A";

      let total = 0;


      cart.forEach((product, index) => {

        message +=
          `${index + 1}. ${product.name} - S/ ${Number(product.price).toFixed(2)}%0A`;

        total += Number(product.price);

      });


      message +=
        `%0A*Total: S/ ${total.toFixed(2)}*`;


      const phone =
        settings.whatsapp.replace(/\D/g, "");


      const url =
        "https://wa.me/" +
        phone +
        "?text=" +
        message;


      window.open(url, "_blank");

    }


    /* =========================
       EDITOR
    ========================= */

    function showEditor() {

      const editor =
        document.getElementById("editor");

      editor.style.display =
        editor.style.display === "none"
          ? "block"
          : "none";


      document.getElementById("editStoreName").value =
        settings.storeName;

      document.getElementById("editSubtitle").value =
        settings.subtitle;

      document.getElementById("editWhatsapp").value =
        settings.whatsapp;

      document.getElementById("editColor").value =
        settings.color;

    }


    function saveSettings() {

      settings.storeName =
        document.getElementById("editStoreName").value.trim()
        || "Jeygly Store";

      settings.subtitle =
        document.getElementById("editSubtitle").value.trim()
        || "Tu tienda moderna en línea";

      settings.whatsapp =
        document.getElementById("editWhatsapp").value.trim();

      settings.color =
        document.getElementById("editColor").value.trim()
        || "#2563eb";


      localStorage.setItem(
        "jeyglySettings",
        JSON.stringify(settings)
      );


      document.getElementById("storeName").textContent =
        settings.storeName;

      document.getElementById("storeSubtitle").textContent =
        settings.subtitle;


      document.documentElement.style.setProperty(
        "--main-color",
        settings.color
      );


      updateColor();

      alert("Configuración guardada correctamente.");

    }


    /* =========================
       AGREGAR PRODUCTO
    ========================= */

    function addProductForm() {

      const form =
        document.getElementById("newProductForm");

      form.style.display =
        form.style.display === "none"
          ? "block"
          : "none";

    }


    function createProduct() {

      const name =
        document.getElementById("newName")
          .value.trim();

      const price =
        Number(
          document.getElementById("newPrice")
            .value
        );

      const category =
        document.getElementById("newCategory")
          .value.trim();

      const image =
        document.getElementById("newImage")
          .value.trim();

      const description =
        document.getElementById("newDescription")
          .value.trim();


      if (!name || !price || !category) {

        alert(
          "Escribe como mínimo nombre, precio y categoría."
        );

        return;
      }


      const newProduct =
