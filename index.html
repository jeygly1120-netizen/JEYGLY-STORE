<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Jeygly Store - tienda online">
<meta name="theme-color" content="#6c5ce7">

<title>Jeygly Store</title>

<style>
:root{
  --primary:#6c5ce7;
  --primary2:#8e7dff;
  --secondary:#00b894;
  --dark:#12131a;
  --dark2:#1c1e27;
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#20222c;
  --muted:#777b87;
  --border:#e5e7ef;
  --danger:#e74c3c;
  --warning:#f39c12;
  --shadow:0 10px 35px rgba(20,20,40,.08);
  --radius:20px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

.hidden{
  display:none!important;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(18,19,26,.96);
  backdrop-filter:blur(15px);
  color:white;
  box-shadow:0 5px 25px #0002;
}

.header{
  max-width:1450px;
  min-height:76px;
  margin:auto;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:230px;
}

.brand-logo{
  width:48px;
  height:48px;
  border-radius:14px;
  background:white;
  object-fit:cover;
  display:block;
}

.brand-name{
  font-size:20px;
  font-weight:800;
}

.brand-subtitle{
  color:#b8bac3;
  font-size:12px;
  margin-top:2px;
}

.search-box{
  flex:1;
  position:relative;
}

.search-box input{
  width:100%;
  border:0;
  outline:0;
  padding:14px 18px;
  border-radius:30px;
  background:white;
  color:#222;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.header-btn{
  border:0;
  color:white;
  background:#ffffff15;
  padding:11px 13px;
  border-radius:12px;
}

.header-btn:hover{
  background:#ffffff28;
}

/* =========================
   HERO
========================= */

.hero{
  max-width:1450px;
  margin:20px auto;
  padding:65px 35px;
  border-radius:28px;
  color:white;
  overflow:hidden;
  position:relative;
  background:
    radial-gradient(circle at 90% 10%,#ffffff35 0 10%,transparent 35%),
    linear-gradient(135deg,var(--primary),var(--secondary));
  box-shadow:var(--shadow);
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:760px;
}

.hero h1{
  font-size:clamp(34px,6vw,68px);
  line-height:1;
  margin-bottom:20px;
}

.hero p{
  font-size:18px;
  line-height:1.6;
  opacity:.95;
  max-width:650px;
}

.hero-buttons{
  display:flex;
  gap:10px;
  margin-top:25px;
  flex-wrap:wrap;
}

.hero-button{
  border:0;
  padding:13px 20px;
  border-radius:12px;
  font-weight:bold;
  background:white;
  color:#222;
}

/* =========================
   CONTAINER
========================= */

.container{
  max-width:1450px;
  margin:auto;
  padding:0 20px 50px;
}

.layout{
  display:grid;
  grid-template-columns:250px 1fr;
  gap:22px;
}

.layout.right{
  grid-template-columns:1fr 250px;
}

.sidebar{
  background:white;
  padding:20px;
  border-radius:var(--radius);
  height:max-content;
  position:sticky;
  top:95px;
  box-shadow:var(--shadow);
}

.sidebar-title{
  font-weight:800;
  margin-bottom:15px;
}

.category{
  width:100%;
  border:0;
  background:#f1f2f6;
  padding:12px;
  border-radius:11px;
  text-align:left;
  margin-bottom:8px;
}

.category:hover,
.category.active{
  background:var(--primary);
  color:white;
}

.category-count{
  float:right;
  opacity:.65;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.toolbar h2{
  font-size:27px;
}

.toolbar select{
  padding:11px 13px;
  border:1px solid var(--border);
  background:white;
  border-radius:11px;
}

/* =========================
   PRODUCTS
========================= */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:var(--card);
  border-radius:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:.2s;
  position:relative;
}

.product:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 40px #0002;
}

.product-image-box{
  height:220px;
  position:relative;
  overflow:hidden;
  background:#eee;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.3s;
}

.product:hover .product-image{
  transform:scale(1.04);
}

.product-badge{
  position:absolute;
  top:12px;
  left:12px;
  background:#ffeaa7;
  color:#705b00;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.product-body{
  padding:16px;
}

.product-category{
  color:var(--primary);
  font-size:12px;
  font-weight:bold;
  margin-bottom:6px;
}

.product-name{
  font-size:18px;
  font-weight:800;
  margin-bottom:7px;
}

.product-description{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  min-height:40px;
}

.product-price{
  font-size:24px;
  font-weight:900;
  margin:13px 0;
}

.product-old-price{
  font-size:13px;
  color:#999;
  text-decoration:line-through;
  margin-left:5px;
}

.product-actions{
  display:flex;
  gap:8px;
}

  padding:11px 14px;
  border-radius:11px;

  background:
